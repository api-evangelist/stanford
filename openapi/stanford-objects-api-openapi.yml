components:
  schemas:
    LaneId:
      description: Lane for prioritizing the work
      type: string
      enum:
      - default
      - low
      - high
      default: default
    VirtualObjectRequest:
      type: object
      required:
      - virtual_object_id
      - constituent_ids
      properties:
        virtual_object_id:
          $ref: https://raw.githubusercontent.com/sul-dlss/cocina-models/refs/tags/v0.113.0/schema.json#/$defs/Druid
        constituent_ids:
          type: array
          items:
            $ref: https://raw.githubusercontent.com/sul-dlss/cocina-models/refs/tags/v0.113.0/schema.json#/$defs/Druid
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    Error:
      type: object
      properties:
        title:
          type: string
          description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem.
          example: Invalid Attribute
        detail:
          type: string
          description: a human-readable explanation specific to this occurrence of the problem.
          example: Title must contain at least three characters.
        meta:
          type: object
          description: used to include non-standard meta-information
          example:
            backtrace:
            - where things went wrong
        source:
          type: object
          properties:
            pointer:
              type: string
              example: /data/attributes/title
    DruidWithOptionalFormat:
      description: Digital Repository Unique Identifier (bare or prefixed), with a file extension
      type: string
      pattern: ^(druid:)?[b-df-hjkmnp-tv-z]{2}[0-9]{3}[b-df-hjkmnp-tv-z]{2}[0-9]{4}(\.json)?$
      example: druid:bc123df4567.json
    ChecksumsForObject:
      description: A representation of all files and checksums for a single object
      type: array
      items:
        type: object
        properties:
          filename:
            type: string
            example: eric-smith-dissertation.pdf
          md5:
            type: string
            example: aead2f6f734355c59af2d5b2689e4fb3
          sha1:
            type: string
            example: 22dc6464e25dc9a7d600b1de6e3848bf63970595
          sha256:
            type: string
            example: e49957d53fb2a46e3652f4d399bd14d019600cf496b98d11ebcdf2d10a8ffd2f
          filesize:
            type: integer
            example: 1000217
        required:
        - filename
        - md5
        - sha1
        - sha256
        - filesize
    ContentDiff:
      description: A diff between given and existing content metadata (XML)
      type: object
      properties:
        objectId:
          $ref: '#/components/schemas/Druid'
        differenceCount:
          type: string
          example: '2'
        basis:
          type: string
          example: v1-contentMetadata-all
        other:
          type: string
          example: new-contentMetadata-all
        reportDatetime:
          type: string
          format: date-time
        fileGroupDifference:
          type: object
          properties:
            groupId:
              type: string
            differenceCount:
              type: string
            identical:
              type: string
            copyadded:
              type: string
            copydeleted:
              type: string
            renamed:
              type: string
            modified:
              type: string
            added:
              type: string
            deleted:
              type: string
            subset:
              type: array
              items:
                type: object
                properties:
                  change:
                    type: string
                  count:
                    type: string
                  file:
                    type: array
                    items:
                      type: object
                      properties:
                        change:
                          type: string
                        basisPath:
                          type: string
                        otherPath:
                          type: string
                        fileSignature:
                          type: object
                          properties:
                            size:
                              type: string
                            md5:
                              type: string
                            sha1:
                              type: string
                            sha256:
                              type: string
      required:
      - object_id
      - difference_count
      - basis
      - other
      - report_datetime
    PreservedObject:
      description: A preserved object instance
      type: object
      properties:
        druid:
          $ref: '#/components/schemas/Druid'
        current_version:
          type: integer
          example: 13
        ok_on_local_storage:
          description: True if the files for the object on local storage (as represented by the  MoabRecord) are not in an error state
          type: boolean
      required:
      - druid
      - current_version
      - ok_on_local_storage
    Druid:
      description: Digital Repository Unique Identifier (bare or prefixed)
      type: string
      pattern: ^(druid:)?[b-df-hjkmnp-tv-z]{2}[0-9]{3}[b-df-hjkmnp-tv-z]{2}[0-9]{4}$
      example: druid:bc123df4567
    CreateObjectResponse:
      type: object
      properties:
        jobId:
          type: string
          description: id for the background job that is processing the create object request
      required:
      - jobId
    Error_2:
      type: object
      properties:
        title:
          type: string
          description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem.
          example: Invalid Attribute
        detail:
          type: string
          description: a human-readable explanation specific to this occurrence of the problem.
          example: Title must contain at least three characters.
        source:
          type: object
          properties:
            pointer:
              type: string
              example: /data/attributes/title
