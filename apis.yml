x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    Every surface in this profile was probed live on 2026-08-19 and every one resolves to a host
    under stanford.edu — the operator axis came back `institution` for all fifteen entries, with
    zero tenant and zero vendor attributions. No Figshare, Pure, Ex Libris, Dataverse or
    Symplectic contract is or was attributed to Stanford. Five first-party OpenAPI contracts were
    recovered from the sul-dlss GitHub org and judged institution-operated by their own
    servers[] (all *.stanford.edu) and info.title, not by where they were fetched. Three genuine
    absences are recorded rather than padded: OAI-PMH is not present (six verb=Identify probes,
    all 404), ORCID could not be evidenced, and there is no institution-operated open-data
    portal. Three discovery applications — searchworks, exhibits and earthworks — sit behind an
    F5/Shape bot defense that returns a 200 JavaScript challenge to any client; they are LIVE for
    humans and unreadable to us, which is a limitation of the probe, not a finding about Stanford.
  evidence:
    - url: https://idp.stanford.edu/metadata.xml
      status: 200
      note: signed SAML 2.0 EntityDescriptor with shibmd:Scope stanford.edu
    - url: https://library-hours.stanford.edu/libraries.json
      status: 200
      note: 'JSON:API document, 24 library locations'
    - url: https://purl.stanford.edu/bb157hs6068.xml
      status: 200
      note: cocina-models/0.127.0 publicObject
    - url: https://purl.stanford.edu/bb157hs6068/iiif/manifest
      status: 200
      note: IIIF Presentation 2.1 manifest
    - url: https://explorecourses.stanford.edu/search?view=xml-20140630&q=CS106A&academicYear=20242025
      status: 200
      note: 'live course XML; body carries <deprecated>true</deprecated>'
    - url: https://raw.githubusercontent.com/sul-dlss/dor-services-app/main/openapi.yml
      status: 200
      note: 'OpenAPI 3.1.2, servers dor-services-{env}.stanford.edu'
    - url: https://uit.stanford.edu/service/ai-api-gateway
      status: 200
      note: AI API Gateway service page
    - url: https://uit.stanford.edu/developers/apis
      status: 200
      note: MaIS Registry developer documentation
    - url: https://purl.stanford.edu/oai?verb=Identify
      status: 404
      note: no OAI-PMH provider — one of six negative probes
    - url: https://searchworks.stanford.edu/?q=maps&search_field=search
      status: 200
      note: F5/Shape bot challenge body, not the application — blocked to automated clients
apis:
  - aid: stanford:library-purl
    name: Stanford Libraries PURL API
    x-operator: institution
    description: >-
      Persistent URLs into the Stanford Digital Repository. GET /{druid} returns HTML,
      /{druid}.xml returns the cocina publicObject document, /{druid}.mods returns MODS 3.7.
      Open, no credential. Verified live 2026-08-19.
    humanURL: https://api.library.stanford.edu/docs/purl/api/
    baseURL: https://purl.stanford.edu
    tags:
      - Library
      - Persistent Identifiers
      - Metadata
      - Digital Repository
    properties:
