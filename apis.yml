  - aid: stanford:explorecourses
    name: ExploreCourses course-data XML query interface
    x-operator: institution
    description: >-
      The Registrar's course catalog, queryable as XML by appending view=xml-20140630 to a
      search. Open, no credential, and the largest genuinely public dataset Stanford serves — a
      single department query returned 17MB in August 2026. No formal reference is published;
      the query form is community-documented. The response itself carries
      <deprecated>true</deprecated> and <latestVersion>20200810</latestVersion>.
    humanURL: https://explorecourses.stanford.edu/about
    baseURL: https://explorecourses.stanford.edu/search
    tags:
