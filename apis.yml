  - aid: stanford:ai-api-gateway
    name: Stanford AI API Gateway
    x-operator: institution
    description: >-
      Direct API access to the large language models hosted in Stanford's own cloud
      infrastructure behind the AI Playground, for faculty, staff and students building their own
      AI applications. Keyed per API key and billed to a Stanford PTA, with usage queryable by
      key, and approved for High Risk data and PHI. Institution-operated at the gateway layer
      even though the models behind it are commercial third parties' — the metering, the key
      issuance, the data-classification approval and the rate card are all Stanford's.
    humanURL: https://uit.stanford.edu/service/ai-api-gateway
    tags:
      - Artificial Intelligence
      - AI Gateway
      - Large Language Models
    properties:
      - type: Documentation
        url: https://uit.stanford.edu/service/ai-api-gateway
      - type: Signup
