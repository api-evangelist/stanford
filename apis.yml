  - aid: stanford:mais-registry
    name: MaIS Registry APIs
    x-operator: institution
    description: >-
      University IT's Registry web services — Account, Person, Student, CourseClass, Privilege
      and Workgroup — over Stanford's consolidated system of record. Documented publicly but
      gated: access requires an x509 client certificate signed by the MaIS team. No public base
      URLs and no sandbox. The Privilege and Workgroup services together are Stanford's campus
      entitlement model, exposed as APIs rather than as scopes.
    humanURL: https://uit.stanford.edu/developers/apis
    tags:
      - Identity
      - Students
      - Registry
      - Administrative
    properties:
      - type: Documentation
        url: https://uit.stanford.edu/developers/apis
      - type: GettingStarted
        url: https://uit.stanford.edu/developers/apis/getting-started
      - type: Signup
        url: https://uit.stanford.edu/developers
  - aid: stanford:cap-profiles
    name: CAP / Stanford Profiles API
    x-operator: institution
    description: >-
      API over the Community Academic Profiles directory (18,000+ faculty, students, postdocs
      and staff). The interactive console at cap.stanford.edu/cap-api/console redirects to
      authentication; credentials are issued via HelpSU. Institution-operated — CAP is Stanford's
      own application, source at github.com/SU-SWS/cap-api, not a Symplectic or Pure tenancy.
    humanURL: https://profiles.sites.stanford.edu/developers
    baseURL: https://cap.stanford.edu/cap-api
    tags:
