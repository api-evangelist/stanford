      - type: Examples
        url: examples/stanford-explorecourses-example.xml
  - aid: stanford:idp-saml
    name: Stanford Identity Provider — SAML 2.0 metadata
    x-operator: institution
    description: >-
      Signed Shibboleth SAML 2.0 identity-provider metadata, entityID https://idp.stanford.edu/,
      valid until 2027-08-16. Declares an IDPSSODescriptor, three SSO bindings (HTTP-POST,
      HTTP-POST-SimpleSign, HTTP-Redirect) at login.stanford.edu, and shibmd:Scope stanford.edu.
      Institution-operated by definition and the strongest domain-standard evidence in this
      profile — it satisfies both `saml` and `shibboleth` in the education regime.
    humanURL: https://uit.stanford.edu/guide/single-sign-on
    baseURL: https://idp.stanford.edu/metadata.xml
    tags:
