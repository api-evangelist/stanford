aid: stanford
name: Stanford University
x-type: university
x-category: Private Research University
description: >-
  Stanford University is a private research university in Stanford, California. Unusually for a
  higher-education institution, essentially its entire programmable footprint is genuinely
  institution-operated rather than a vendor tenancy: every surface listed here runs on a
  stanford.edu host. Stanford Libraries (SUL-DLSS) publishes five first-party OpenAPI contracts
  for the Stanford Digital Repository — SDR, DOR Services, Technical Metadata, Preservation
  Catalog and SURI, 76 operations, Apache 2.0, on its own GitHub org — though the services
  themselves sit on the internal network. Public and open without credentials are PURL
  (XML/MODS/IIIF Presentation 2.1 off purl.stanford.edu), the Library Hours JSON:API, and the
  Registrar's ExploreCourses XML query interface, which reports its own deprecation in every
  response body. University IT runs the certificate-gated MaIS Registry web services (Account,
  Person, Student, CourseClass, Privilege, Workgroup) and a metered AI API Gateway keyed to a
  Stanford billing account. Stanford also publishes signed Shibboleth SAML 2.0 identity-provider
  metadata at idp.stanford.edu — machine-readable identity federation that most universities
  never get catalogued. What is missing is equally clear: no OAI-PMH provider was found on any
  Stanford host, no institution-operated open-data portal, no OAuth scopes, no contact or terms
  in any contract, no examples on any of the 76 operations, and no unified developer portal
  spanning the Libraries and University IT surfaces.
type: Index
