name: Stanford University — error semantics
description: >-
  Error handling across Stanford's institution-operated API surfaces, read out of the five
  first-party Stanford Digital Repository contracts and out of live responses from the open
  library and registrar surfaces. The SDR contracts converge on a shared JSON:API-style error
  envelope; the open public surfaces do not document errors at all and answer 404 with an HTML
  page, which is the largest error-semantics gap in this profile.
generated: '2026-08-19'
modified: '2026-08-19'
method: derived
source: >-
  openapi/_original/*.yml (responses blocks and components.schemas.Error/ErrorResponse),
  plus live 404 probes against purl.stanford.edu and api.library.stanford.edu.
x-operator: institution
envelope:
  name: ErrorResponse
  media_type: application/json
  method: derived
  declared_in:
    - openapi/_original/stanford-sdr-api-openapi.yml
    - openapi/_original/stanford-dor-services-api-openapi.yml
    - openapi/_original/stanford-suri-api-openapi.yml
  shape: >-
    { "errors": [ { "title": string, "detail": string, "source": { "pointer": ... }, "meta": {} } ] }
  note: >-
    A JSON:API errors array. `title` is documented as stable across occurrences and `detail` as
    occurrence-specific — the distinction most error schemas omit. Three of the five contracts
    share it verbatim, which is real cross-service consistency inside sul-dlss.
  gaps:
    - No machine-readable error `code` field — only human-readable strings.
    - >-
      No RFC 9457 (problem+json) content type; the envelope is hand-rolled JSON:API rather than
      the IETF standard.
    - >-
      Preservation Catalog and Technical Metadata declare error status codes but reference no
      error schema at all.
