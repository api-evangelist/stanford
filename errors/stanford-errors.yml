public_surfaces:
  method: probed
  note: >-
    The four open surfaces — PURL, IIIF, Library Hours, ExploreCourses — publish no error
    reference and no machine-readable error body. An unknown identifier returns an HTML 404
    page, so an agent cannot distinguish "no such object" from "service moved" without parsing
    markup.
